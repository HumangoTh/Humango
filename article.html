<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="บทความ - HUMANgo">
  <title>บทความ - HUMANgo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;700;800;900&family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --indigo:    #475569;
      --amber:     #D97706;
      --mint:      #10B981;
      --white:     #FFFFFF;
      --soft-bg:   #F8FAFC;
      --text:      #1E293B;
      --muted:     #64748B;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Sarabun', sans-serif; font-size: 20px; color: var(--text); background: var(--white); overflow-x: hidden; }
    h1,h2,h3 { font-family: 'Raleway', sans-serif; }
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      background: var(--white); backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 48px; height: 62px;
      border-bottom: 1px solid rgba(71,85,105,.08);
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
    .nav-logo img { height: 36px; object-fit: contain; }
    .nav-links { display: flex; gap: 28px; list-style: none; }
    .nav-links a { color: var(--text); text-decoration: none; font-size: .88rem; font-weight: 500; transition: color .2s; }
    .nav-links a:hover { color: var(--indigo); }
    .nav-cta { background: var(--amber) !important; color: #fff !important; padding: 7px 22px; border-radius: 50px; font-weight: 700 !important; }
    .con { max-width: 1060px; margin: 0 auto; padding: 0 24px; }
    .article-container { padding: 100px 24px 60px; }
    .article-header { margin-bottom: 40px; }
    .article-title { font-size: 2rem; font-weight: 900; color: var(--indigo); margin-bottom: 16px; line-height: 1.3; }
    .article-meta { display: flex; gap: 20px; font-size: .9rem; color: var(--muted); margin-bottom: 24px; flex-wrap: wrap; }
    .article-tags { display: flex; gap: 8px; flex-wrap: wrap; margin: 20px 0; }
    .tag { display: inline-block; background: var(--soft-bg); color: var(--indigo); font-size: .8rem; padding: 6px 14px; border-radius: 50px; font-weight: 600; }
    .article-body { font-size: .95rem; color: var(--text); line-height: 1.95; margin-bottom: 60px; }
    .article-body h2 { font-size: 1.6rem; margin: 32px 0 16px; color: var(--indigo); }
    .article-body h3 { font-size: 1.3rem; margin: 24px 0 12px; color: var(--indigo); }
    .article-body p { margin-bottom: 16px; }
    .article-body ul, .article-body ol { margin: 20px 0 20px 24px; }
    .article-body li { margin-bottom: 10px; }
    .article-body strong { color: var(--indigo); font-weight: 700; }
    .article-body img { max-width: 100%; height: auto; border-radius: 12px; margin: 24px 0; }
    .related-section { border-top: 1px solid #E2E8F0; padding-top: 40px; }
    .related-title { font-size: 1.4rem; font-weight: 800; color: var(--indigo); margin-bottom: 24px; }
    .related-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .related-card { background: var(--soft-bg); border-radius: 12px; padding: 20px; transition: all .3s; cursor: pointer; }
    .related-card:hover { background: var(--white); border: 1px solid var(--amber); transform: translateY(-2px); }
    .related-card h4 { font-size: .95rem; font-weight: 700; color: var(--indigo); margin-bottom: 8px; line-height: 1.4; }
    .related-card p { font-size: .85rem; color: var(--muted); line-height: 1.6; }
    footer { background: var(--text); padding: 24px; text-align: center; border-top: 1px solid rgba(71,85,105,.1); margin-top: 60px; }
    footer p { font-size: .78rem; color: rgba(255,255,255,.28); }
    footer span { color: var(--amber); }
    section { padding: 60px 24px; }
    @media (max-width: 860px) {
      nav { padding: 0 20px; }
      .nav-links { display: none; }
      .article-title { font-size: 1.6rem; }
      .related-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<nav>
  <a href="/" class="nav-logo">
    <img src="logo.png" alt="HUMANgo">
  </a>
  <ul class="nav-links">
    <li><a href="/Humango/#about">เกี่ยวกับเรา</a></li>
    <li><a href="/Humango/#courses">หลักสูตร</a></li>
    <li><a href="blog.html">บทความ</a></li>
    <li><a href="/Humango/#track">ผลงาน</a></li>
    <li><a href="/Humango/#contact" class="nav-cta">ติดต่อเรา</a></li>
  </ul>
</nav>
<section class="article-container">
  <div class="con">
    <div class="article-header">
      <h1 class="article-title" id="articleTitle">กำลังโหลด...</h1>
      <div class="article-meta">
        <span class="article-date" id="articleDate"></span>
        <span class="article-author" id="articleAuthor"></span>
      </div>
      <div class="article-tags" id="articleTags"></div>
    </div>
    <div class="article-body" id="articleContent"></div>
    <div class="related-section" id="relatedSection" style="display: none;">
      <h2 class="related-title">บทความที่เกี่ยวข้อง</h2>
      <div class="related-grid" id="relatedArticles"></div>
    </div>
  </div>
</section>
<footer>
  <p>© 2568–2569 <span>HUMANgo</span> — Grow Your People &nbsp;|&nbsp; ดร.พลภัทร เจริญเวียงเวชกิจ &nbsp;|&nbsp; เชียงใหม่</p>
</footer>
<script src="/Humango/blog.js"></script>
<script>
  const urlParams = new URLSearchParams(window.location.search);
  const articleId = urlParams.get('id');
  async function loadArticle() {
    try {
      const response = await fetch('/Humango/articles/data.json');
      if (!response.ok) throw new Error('Failed');
      const data = await response.json();
      data.articles.forEach(article => window.Blog.articles.push(article));
      window.Blog.updateTags();
      const article = window.Blog.getArticleById(articleId);
      if (!article) {
        document.getElementById('articleTitle').textContent = 'ไม่พบบทความ';
        return;
      }
      article.contentHtml = window.BlogUtils.markdownToHtml(article.content);
      window.BlogUtils.renderArticle(article, 'articleTitle', 'articleDate', 'articleAuthor', 'articleTags', 'articleContent');
      const relatedArticles = window.Blog.getRelatedArticles(articleId);
      if (relatedArticles.length > 0) {
        window.BlogUtils.renderRelatedArticles(relatedArticles, 'relatedArticles');
        document.getElementById('relatedSection').style.display = 'block';
      }
    } catch (error) {
      document.getElementById('articleTitle').textContent = 'เกิดข้อผิดพลาด';
    }
  }
  window.addEventListener('load', loadArticle);
</script>
</body>
</html>
